
services:
  flowops:
    build:
      context: .
      dockerfile: FlowOps/Dockerfile
    image: flowops:dev
    container_name: flowops
    ports:
      - "5056:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"

      FLOWOPS_ROLE: "api"

      ConnectionStrings__ReportingDb: "${REPORTINGDB}"

      RabbitMQ__HostName: "${RabbitMQ__HostName}"
      RabbitMQ__Port: "${RabbitMQ__Port}"
      RabbitMQ__UserName: "${RabbitMQ__UserName}"
      RabbitMQ__Password: "${RabbitMQ__Password}"
      RabbitMQ__VirtualHost: "${RabbitMQ__VirtualHost}"
  billing:
     image: "flowops:dev"
     container_name: flowops-billing
     environment:
      ASPNETCORE_ENVIRONMENT: "Development"

      FLOWOPS_ROLE: "billing"

      ConnectionStrings__ReportingDb: "${REPORTINGDB}"

      ASPNETCORE_URLS: "http://127.0.0.1:0"
      ASPNETCORE_HTTP_PORTS: ""
      ASPNETCORE_HTTPS_PORTS: ""

      RabbitMQ__HostName: "${RabbitMQ__HostName}"
      RabbitMQ__Port: "${RabbitMQ__Port}"
      RabbitMQ__UserName: "${RabbitMQ__UserName}"
      RabbitMQ__Password: "${RabbitMQ__Password}"
      RabbitMQ__VirtualHost: "${RabbitMQ__VirtualHost}"

  reporting:
     image: "flowops:dev"
     container_name: flowops-reporting
     environment:
      ASPNETCORE_ENVIRONMENT: "Development"

      FLOWOPS_ROLE: "reporting"

      ConnectionStrings__ReportingDb: "${REPORTINGDB}"

      ASPNETCORE_URLS: "http://127.0.0.1:0"
      ASPNETCORE_HTTP_PORTS: ""
      ASPNETCORE_HTTPS_PORTS: ""

      RabbitMQ__HostName: "${RabbitMQ__HostName}"
      RabbitMQ__Port: "${RabbitMQ__Port}"
      RabbitMQ__UserName: "${RabbitMQ__UserName}"
      RabbitMQ__Password: "${RabbitMQ__Password}"
      RabbitMQ__VirtualHost: "${RabbitMQ__VirtualHost}"